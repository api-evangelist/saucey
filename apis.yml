aid: saucey
name: Saucey
description: >-
  Saucey is an on-demand alcohol delivery service that brings beer, wine, and
  spirits from local retailers to customers' doors, often in under an hour,
  across a growing list of US markets. Founded in 2013 and headquartered in Los
  Angeles, the company operates consumer iOS, Android, and web ordering
  experiences, a Saucey Club membership offering free delivery and perks, and a
  retailer/brand partnership program. Saucey is backed by 500 Global and Bullpen
  Capital. This profile tracks Saucey in the API Evangelist network; as of this
  enrichment pass Saucey publishes no public developer portal, API reference, or
  machine-readable API specification.
